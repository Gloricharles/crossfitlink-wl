<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CrossFit Link - Suivi weightlifting (S31-S36)</title>
<style>
:root{
  --bg:#F5F3EE; --ink:#1B1B19; --muted:#6B6862; --line:#DDD9CC; --card:#FFFFFF;
  --snatch:#185FA5; --snatch-soft:#E6F1FB;
  --cj:#993C1D;    --cj-soft:#FAECE7;
  --trans:#0F6E56; --trans-soft:#E1F5EE;
  --accent:#C1432B; --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.page{max-width:460px;margin:0 auto;padding:20px 18px 60px;}
.eyebrow{font-weight:700;letter-spacing:.12em;font-size:11px;color:var(--accent);margin:0 0 2px;text-transform:uppercase;}
h1{font-size:26px;font-weight:800;margin:0 0 3px;letter-spacing:-.02em;}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px;}
.cfg-warn{background:#FEF3CD;border:1px solid #F0C040;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;color:#7A5000;}
.plates{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.plate{
  flex:0 0 auto;width:60px;height:60px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);position:relative;cursor:pointer;gap:1px;transition:transform .12s;user-select:none;
}
.plate:active{transform:scale(.94);}
.plate-id{font-weight:800;font-size:14px;line-height:1.1;}
.plate-scheme{font-weight:600;font-size:10px;line-height:1.1;opacity:.75;}
.plate.type-snatch{border-color:var(--snatch);color:var(--snatch);}
.plate.type-cj{border-color:var(--cj);color:var(--cj);}
.plate.type-transition{border-color:var(--trans);color:var(--trans);}
.plate.filled.type-snatch{background:var(--snatch);color:#fff;}
.plate.filled.type-cj{background:var(--cj);color:#fff;}
.plate.filled.type-transition{background:var(--trans);color:#fff;}
.plate.today::after{content:'';position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);}
.plate.selected{box-shadow:0 0 0 3px rgba(0,0,0,.1);}
.ctx-card{border-radius:var(--radius);padding:13px 15px;margin-bottom:14px;border:1px solid var(--line);}
.ctx-card .label{font-weight:800;font-size:16px;margin:0 0 2px;}
.ctx-card .meta{font-size:13px;margin:0;opacity:.85;}
.form-card,.hist-card,.coach-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px;}
input[type=text],input[type=number]{display:block;width:100%;margin-top:5px;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;color:var(--ink);}
input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.trans-note{font-size:14px;background:var(--trans-soft);color:#085041;padding:12px;border-radius:10px;margin-bottom:6px;}
.backoff-hint{background:var(--snatch-soft);color:#0C447C;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4;margin:-8px 0 14px;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;letter-spacing:.01em;cursor:pointer;margin-top:6px;}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.feedback{font-size:13px;margin:10px 0 0;min-height:16px;}
.feedback.ok{color:#0F6E56;} .feedback.err{color:#993C1D;}
.hist-card h2,.coach-card h2{font-size:15px;margin:0 0 10px;font-weight:800;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px;}
.hist-row:last-child{border-bottom:none;}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;}
.swatch{width:8px;height:8px;border-radius:50%;}
.hist-row span:last-child{text-align:right;}
.empty{font-size:13px;color:var(--muted);}
.link-btn{display:block;margin:0 auto 0;background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{border:1px solid var(--line);padding:6px 4px;text-align:center;}
th{font-weight:800;background:#FAF8F2;}
.name-col{text-align:left;font-weight:700;}
.cur-col{background:#FCEFE9;}
.score-main{display:block;font-weight:800;font-size:13px;line-height:1.2;}
.score-sec{display:block;font-size:10px;font-weight:600;opacity:.65;line-height:1.2;}
.coach-legend{font-size:11px;color:var(--muted);margin:0 0 8px;}
.th-scheme{display:block;font-size:10px;font-weight:600;opacity:.7;}
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">CrossFit Link</p>
  <h1>Suivi weightlifting</h1>
  <p class="sub">Cycle S31-S36 - Clean &amp; jerk / Snatch</p>

  <div id="cfgWarn" class="cfg-warn" hidden>
    ⚙️ L'URL du script n'est pas configurée dans index.html.
  </div>

  <div class="plates" id="plateRow"></div>
  <div class="ctx-card" id="ctxCard"></div>

  <div class="form-card">
    <label>Ton prénom et nom
      <input id="nameInput" list="rosterList" placeholder="ex. Camille Dupont" autocomplete="off"/>
    </label>
    <datalist id="rosterList"></datalist>
    <div id="fieldsContainer"></div>
    <button id="submitBtn" class="btn">Enregistrer</button>
    <p id="feedback" class="feedback" aria-live="polite"></p>
  </div>

  <div class="hist-card">
    <h2>Mon historique</h2>
    <div id="histContent" class="empty">Entre ton prénom pour voir ton historique.</div>
  </div>

  <button class="link-btn" id="coachToggle">Vue coach - qui a rempli quoi</button>
  <div class="coach-card" id="coachCard" hidden>
    <h2>Vue d'ensemble</h2>
    <div id="coachContent" class="empty">Chargement...</div>
  </div>

</div>
<script>
// ---- CONFIG ------------------------------------------------------------
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmZjO4RGcnk9gD3uQPR1Q5Qm91rMo3D5Y9gzcnKxeCicaR3xegtE3ibU9048zE5vd-/exec';
const SHEET_TAB  = 'Cycle_S31-36';   // onglet dédié à ce cycle (créé automatiquement)

// ---- WEEKS -------------------------------------------------------------
const WEEKS = [
  { id:'W1', start:'2026-08-19', type:'cj', label:'Clean & jerk', scheme:'3RM',
    target:'3RM squat clean + split jerk + 5 reps clean pull @ 3RM',
    fields:[
      {key:'value',     short:'SC+SJ',      label:'Charge - squat clean + split jerk 3RM (kg)', placeholder:'ex. 80'},
      {key:'secondary', short:'Clean pull', label:'Clean pull (kg) - 5 reps @ 3RM',             placeholder:'ex. 95'}
    ]},
  { id:'W2', start:'2026-08-26', type:'snatch', label:'Snatch', scheme:'1+3',
    target:'Max load : 1 hang power snatch + 3 overhead squat + OHS du sol 10RM',
    fields:[
      {key:'value',     short:'HPS+OHS', label:'Charge - 1 hang power snatch + 3 OHS (kg)', placeholder:'ex. 55'},
      {key:'secondary', short:'OHS sol', label:'Overhead squat du sol 10RM (kg)',           placeholder:'ex. 60', backoff:{pct:0.75, reps:10, movement:'overhead squat'}}
    ]},
  { id:'W3', start:'2026-09-02', type:'cj', label:'Clean & jerk', scheme:'2RM',
    target:'2RM squat clean + split jerk + 4 reps clean pull @ 2RM',
    fields:[
      {key:'value',     short:'SC+SJ',      label:'Charge - squat clean + split jerk 2RM (kg)', placeholder:'ex. 85'},
      {key:'secondary', short:'Clean pull', label:'Clean pull (kg) - 4 reps @ 2RM',             placeholder:'ex. 100'}
    ]},
  { id:'W4', start:'2026-09-09', type:'snatch', label:'Snatch', scheme:'1+2',
    target:'Max load : 1 hang power snatch + 2 overhead squat + OHS du sol 8RM',
    fields:[
      {key:'value',     short:'HPS+OHS', label:'Charge - 1 hang power snatch + 2 OHS (kg)', placeholder:'ex. 60'},
      {key:'secondary', short:'OHS sol', label:'Overhead squat du sol 8RM (kg)',            placeholder:'ex. 65', backoff:{pct:0.75, reps:8, movement:'overhead squat'}}
    ]},
  { id:'W5', start:'2026-09-16', type:'cj', label:'Clean & jerk', scheme:'1RM',
    target:'1RM squat clean + split jerk + 3 reps clean pull @ 1RM',
    fields:[
      {key:'value',     short:'SC+SJ',      label:'Charge - squat clean + split jerk 1RM (kg)', placeholder:'ex. 90'},
      {key:'secondary', short:'Clean pull', label:'Clean pull (kg) - 3 reps @ 1RM',             placeholder:'ex. 105'}
    ]},
  { id:'W6', start:'2026-09-23', type:'snatch', label:'Snatch', scheme:'1+1',
    target:'Max load : 1 hang power snatch + 1 overhead squat + OHS du sol 6RM',
    fields:[
      {key:'value',     short:'HPS+OHS', label:'Charge - 1 hang power snatch + 1 OHS (kg)', placeholder:'ex. 65'},
      {key:'secondary', short:'OHS sol', label:'Overhead squat du sol 6RM (kg)',            placeholder:'ex. 70', backoff:{pct:0.75, reps:6, movement:'overhead squat'}}
    ]}
];

// ---- STATE -------------------------------------------------------------
let selectedIdx = currentWeekIndex();
let athleteData  = null;

// ---- UTILS -------------------------------------------------------------
function currentWeekIndex() {
  const now = new Date();
  let idx = 0;
  WEEKS.forEach((w, i) => { if (now >= new Date(w.start + 'T00:00:00')) idx = i; });
  return idx;
}
function typeColor(type) {
  return type === 'snatch' ? '#185FA5' : type === 'cj' ? '#993C1D' : '#0F6E56';
}
function fmtKg(n) {
  return (Math.round(n * 10) / 10).toString().replace('.', ',');
}
function backoffRange(rm, pct) {
  const center = Math.round((rm * pct) / 2.5) * 2.5;
  return [center - 2.5, center + 2.5];
}

// ---- API (JSONP) -------------------------------------------------------
function api(params) {
  return new Promise(function(resolve, reject) {
    if (SCRIPT_URL === 'VOTRE_URL_ICI') { reject(new Error('SCRIPT_URL non configurée')); return; }
    var cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var script = document.createElement('script');
    var timeout = setTimeout(function() { cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup() {
      clearTimeout(timeout);
      try { delete window[cbName]; } catch(e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) { cleanup(); resolve(data); };
    var query = Object.assign({}, params, { sheet: SHEET_TAB, callback: cbName });
    script.src = SCRIPT_URL + '?' + new URLSearchParams(query).toString();
    script.onerror = function() { cleanup(); reject(new Error('script error')); };
    document.head.appendChild(script);
  });
}

async function loadRoster() {
  try {
    const d = await api({ action: 'roster' });
    const list = document.getElementById('rosterList');
    list.innerHTML = (d.names || []).map(n => `<option value="${n}"></option>`).join('');
  } catch(e) {}
}

async function loadAthlete(name) {
  if (!name.trim()) { athleteData = null; renderAll(); return; }
  try { athleteData = await api({ action: 'read', name: name.trim() }); }
  catch(e) { athleteData = { weeks: {} }; }
  renderAll();
}

// ---- RENDER ------------------------------------------------------------
function renderPlates() {
  const row = document.getElementById('plateRow');
  const curIdx = currentWeekIndex();
  row.innerHTML = '';
  WEEKS.forEach((w, i) => {
    const filled = athleteData && athleteData.weeks && athleteData.weeks[w.id];
    const cls = ['plate', 'type-' + w.type, filled ? 'filled' : '',
      i === selectedIdx ? 'selected' : '', i === curIdx ? 'today' : ''].filter(Boolean).join(' ');
    const el = document.createElement('div');
    el.className = cls;
    el.innerHTML = '<span class="plate-id">' + w.id + '</span>' + (w.scheme ? '<span class="plate-scheme">' + w.scheme + '</span>' : '');
    el.addEventListener('click', () => { selectedIdx = i; renderAll(); });
    row.appendChild(el);
  });
}

function renderContext() {
  const el = document.getElementById('ctxCard');
  const wk = WEEKS[selectedIdx];
  el.style.background = wk.type === 'snatch' ? 'var(--snatch-soft)' : wk.type === 'cj' ? 'var(--cj-soft)' : 'var(--trans-soft)';
  el.style.borderColor = typeColor(wk.type);
  el.innerHTML = `<p class="label" style="color:${typeColor(wk.type)}">${wk.id} - ${wk.label}</p><p class="meta">Objectif : ${wk.target}</p>`;
}

function renderFields() {
  const wk  = WEEKS[selectedIdx];
  const con = document.getElementById('fieldsContainer');
  const btn = document.getElementById('submitBtn');
  const existing = (athleteData && athleteData.weeks && athleteData.weeks[wk.id]) || {};

  btn.style.display = 'block';
  con.innerHTML = wk.fields.map((f, i) => `
    <label>${f.label}
      <input type="number" inputmode="decimal" step="0.5" id="field-${i}"
        value="${existing[f.key] != null ? existing[f.key] : ''}"
        placeholder="${f.placeholder}"/>
    </label>${f.backoff ? `<div class="backoff-hint" id="backoff-${i}" hidden></div>` : ''}`).join('');

  wk.fields.forEach((f, i) => {
    if (!f.backoff) return;
    const inp = document.getElementById('field-' + i);
    const hint = document.getElementById('backoff-' + i);
    function update() {
      const rm = parseFloat(inp.value);
      if (!rm || rm <= 0) { hint.hidden = true; hint.innerHTML = ''; return; }
      const r = backoffRange(rm, f.backoff.pct);
      hint.hidden = false;
      hint.innerHTML = '2e bloc ' + f.backoff.movement + ' - 3 × ' + f.backoff.reps + ' reps à '
        + Math.round(f.backoff.pct * 100) + '% : charge entre <strong>' + fmtKg(r[0])
        + '</strong> et <strong>' + fmtKg(r[1]) + ' kg</strong>';
    }
    inp.addEventListener('input', update);
    update();
  });
}

function renderHistory() {
  const el  = document.getElementById('histContent');
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { el.className = 'empty'; el.textContent = 'Entre ton prénom pour voir ton historique.'; return; }
  if (!athleteData || !athleteData.weeks || Object.keys(athleteData.weeks).length === 0) {
    el.className = 'empty'; el.textContent = "Pas encore d'historique pour ce cycle."; return;
  }
  el.className = '';
  el.innerHTML = WEEKS
    .filter(w => athleteData.weeks[w.id])
    .map(w => {
      const d = athleteData.weeks[w.id];
      const vals = w.fields.map(f => d[f.key] != null ? `${f.short} : ${d[f.key]} kg` : null).filter(Boolean).join(' / ');
      return `<div class="hist-row">
        <span class="tag"><span class="swatch" style="background:${typeColor(w.type)}"></span>${w.id} - ${w.label}${w.scheme ? ' (' + w.scheme + ')' : ''}</span>
        <span>${vals}</span>
      </div>`;
    }).join('');
}

function renderAll() {
  renderPlates();
  renderContext();
  renderFields();
  renderHistory();
}

// ---- EVENTS ------------------------------------------------------------
document.getElementById('nameInput').addEventListener('change', e => loadAthlete(e.target.value));
document.getElementById('nameInput').addEventListener('blur',   e => loadAthlete(e.target.value));

document.getElementById('submitBtn').addEventListener('click', async () => {
  const fb   = document.getElementById('feedback');
  const name = document.getElementById('nameInput').value.trim();
  const wk   = WEEKS[selectedIdx];

  if (!name) { fb.className = 'feedback err'; fb.textContent = "Entre ton prénom avant d'enregistrer."; return; }
  const first = document.getElementById('field-0');
  if (!first || !first.value) { fb.className = 'feedback err'; fb.textContent = 'Indique au moins la charge principale.'; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; fb.className = 'feedback'; fb.textContent = 'Enregistrement...';

  const params = { action: 'write', name, week: wk.id };
  wk.fields.forEach((f, i) => {
    const inp = document.getElementById('field-' + i);
    params[f.key] = inp && inp.value ? inp.value : '';
  });

  try {
    await api(params);
    fb.className = 'feedback ok'; fb.textContent = `Enregistré - ${wk.id} ${wk.label}.`;
    await loadAthlete(name);
    await loadRoster();
  } catch(e) {
    fb.className = 'feedback err'; fb.textContent = 'Erreur de connexion, réessaie dans un instant.';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('coachToggle').addEventListener('click', async () => {
  const card = document.getElementById('coachCard');
  const con  = document.getElementById('coachContent');
  card.hidden = !card.hidden;
  if (card.hidden) return;

  con.className = 'empty'; con.textContent = 'Chargement...';
  try {
    const d = await api({ action: 'all' });
    if (!d.athletes || d.athletes.length === 0) {
      con.textContent = "Personne n'a encore enregistré de résultat."; return;
    }
    const curIdx = currentWeekIndex();
    let html = '<p class="coach-legend">Grand chiffre : charge principale (kg) - petit chiffre : accessoire (kg).</p>';
    html += '<div class="table-wrap"><table><thead><tr><th class="name-col">Athlète</th>';
    WEEKS.forEach((w, i) => html += `<th class="${i === curIdx ? 'cur-col' : ''}">${w.id}${w.scheme ? '<span class="th-scheme">' + w.scheme + '</span>' : ''}</th>`);
    html += '</tr></thead><tbody>';
    d.athletes.forEach(rec => {
      html += `<tr><td class="name-col">${rec.name}</td>`;
      WEEKS.forEach((w, i) => {
        const d2 = rec.weeks && rec.weeks[w.id];
        const has = d2 && d2.value != null;
        let cell = '-';
        if (has) {
          cell = `<span class="score-main">${d2.value}</span>`;
          if (d2.secondary != null) cell += `<span class="score-sec">${d2.secondary}</span>`;
        }
        html += `<td class="${i === curIdx ? 'cur-col' : ''}" style="${has ? 'color:' + typeColor(w.type) : ''}">${cell}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    con.className = ''; con.innerHTML = html;
  } catch(e) {
    con.className = 'empty'; con.textContent = 'Impossible de charger les données.';
  }
});

// ---- INIT --------------------------------------------------------------
if (SCRIPT_URL === 'VOTRE_URL_ICI') document.getElementById('cfgWarn').hidden = false;
else loadRoster();
renderAll();
</script>
</body>
</html>
